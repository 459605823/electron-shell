<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>正在连接大屏…</title>
    <style>
      :root { color-scheme: dark; }
      html, body { height: 100%; margin: 0; background: #000; color: #fff; font: 16px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,'Noto Sans',sans-serif; }
      .wrap { height: 100%; display: grid; place-items: center; text-align: center; gap: 16px; }
      .spinner { width: 48px; height: 48px; border: 4px solid #333; border-top-color: #0af; border-radius: 50%; animation: s 1s linear infinite; margin: 0 auto 8px; }
      @keyframes s { to { transform: rotate(360deg); } }
      button { background: #0af; color: #000; border: 0; padding: 10px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; }
      button:disabled { opacity: .6; cursor: default; }
      .muted { opacity: .8; font-size: 14px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div>
        <div class="spinner" aria-hidden="true"></div>
        <h1 style="margin: 8px 0 12px;">正在连接大屏…</h1>
        <p class="muted">网络异常或目标地址不可达，系统将自动重试。</p>
        <button id="retry">立即重试</button>
      </div>
    </div>
    <script>
      const btn = document.getElementById('retry');
      btn?.addEventListener('click', async () => {
        btn.disabled = true;
        try {
          await window.kiosk?.reloadRemote?.();
        } finally {
          setTimeout(() => (btn.disabled = false), 1500);
        }
      });
    </script>
  </body>
</html>
